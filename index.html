<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Light Red & Blue Calculator</title>
  <link rel="icon" type="image/svg+xml" href='data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"%3E%3Crect width="64" height="64" rx="14" fill="%231e88e5"/%3E%3Crect x="9" y="9" width="46" height="16" rx="5" fill="%23ffffff"/%3E%3Crect x="9" y="31" width="21" height="11" rx="4" fill="%23e3f2fd"/%3E%3Crect x="34" y="31" width="21" height="11" rx="4" fill="%23ffcdd2"/%3E%3Crect x="9" y="46" width="21" height="11" rx="4" fill="%23e3f2fd"/%3E%3Crect x="34" y="46" width="21" height="11" rx="4" fill="%23ef5350"/%3E%3C/svg%3E'>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #fce4e4 0%, #e3f2fd 100%);
    }

    .calculator {
      width: 320px;
      padding: 24px;
      border-radius: 24px;
      background: #ffffff;
      box-shadow: 0 12px 30px rgba(100, 150, 200, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.8);
    }

    .display {
      width: 100%;
      height: 90px;
      background-color: #f7fafc;
      border-radius: 16px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: flex-end;
      margin-bottom: 20px;
      box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.03);
      border: 1px solid #edf2f7;
    }

    .previous-operand {
      font-size: 0.9rem;
      color: #90a4ae;
      min-height: 1.1rem;
      word-break: break-all;
    }

    .current-operand {
      font-size: 2rem;
      font-weight: 600;
      color: #2c3e50;
      word-break: break-all;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    button {
      height: 58px;
      border-radius: 14px;
      border: none;
      font-size: 1.2rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease-in-out;
      outline: none;
    }

    /* Number Buttons - Light Blue Theme */
    .btn-number {
      background-color: #e3f2fd;
      color: #1e88e5;
    }

    .btn-number:hover {
      background-color: #bbdefb;
      transform: translateY(-2px);
    }

    .btn-number:active {
      transform: translateY(0);
    }

    /* Operator & Functional Buttons - Light Red Theme */
    .btn-operator {
      background-color: #ffebee;
      color: #e53935;
    }

    .btn-operator:hover {
      background-color: #ffcdd2;
      transform: translateY(-2px);
    }

    .btn-operator:active {
      transform: translateY(0);
    }

    /* Equals Button - Highlight Accent */
    .btn-equals {
      background-color: #ef5350;
      color: #ffffff;
      grid-column: span 2;
      box-shadow: 0 4px 10px rgba(239, 83, 80, 0.3);
    }

    .btn-equals:hover {
      background-color: #e53935;
      transform: translateY(-2px);
      box-shadow: 0 6px 14px rgba(239, 83, 80, 0.4);
    }

    .btn-equals:active {
      transform: translateY(0);
    }

    .btn-clear {
      grid-column: span 2;
    }
  </style>
</head>
<body>

  <div class="calculator">
    <div class="display">
      <div class="previous-operand" id="previous-operand"></div>
      <div class="current-operand" id="current-operand">0</div>
    </div>
    <div class="buttons">
      <button class="btn-operator btn-clear" onclick="clearDisplay()">AC</button>
      <button class="btn-operator" onclick="deleteDigit()">DEL</button>
      <button class="btn-operator" onclick="appendOperator('/')">÷</button>

      <button class="btn-number" onclick="appendNumber('7')">7</button>
      <button class="btn-number" onclick="appendNumber('8')">8</button>
      <button class="btn-number" onclick="appendNumber('9')">9</button>
      <button class="btn-operator" onclick="appendOperator('*')">×</button>

      <button class="btn-number" onclick="appendNumber('4')">4</button>
      <button class="btn-number" onclick="appendNumber('5')">5</button>
      <button class="btn-number" onclick="appendNumber('6')">6</button>
      <button class="btn-operator" onclick="appendOperator('-')">−</button>

      <button class="btn-number" onclick="appendNumber('1')">1</button>
      <button class="btn-number" onclick="appendNumber('2')">2</button>
      <button class="btn-number" onclick="appendNumber('3')">3</button>
      <button class="btn-operator" onclick="appendOperator('+')">+</button>

      <button class="btn-number" onclick="appendNumber('0')">0</button>
      <button class="btn-number" onclick="appendNumber('.')">.</button>
      <button class="btn-equals" onclick="calculate()">=</button>
    </div>
  </div>

  <script>
    let currentInput = '0';
    let previousInput = '';
    let operation = null;

    const currentDisplay = document.getElementById('current-operand');
    const previousDisplay = document.getElementById('previous-operand');

    function updateDisplay() {
      currentDisplay.innerText = currentInput;
      if (operation != null) {
        previousDisplay.innerText = `${previousInput} ${getSymbol(operation)}`;
      } else {
        previousDisplay.innerText = '';
      }
    }

    function getSymbol(op) {
      switch(op) {
        case '+': return '+';
        case '-': return '−';
        case '*': return '×';
        case '/': return '÷';
        default: return '';
      }
    }

    function appendNumber(number) {
      if (number === '.' && currentInput.includes('.')) return;
      if (currentInput === '0' && number !== '.') {
        currentInput = number;
      } else {
        currentInput += number;
      }
      updateDisplay();
    }

    function appendOperator(op) {
      if (currentInput === '' && previousInput === '') return;
      if (previousInput !== '') {
        calculate();
      }
      operation = op;
      previousInput = currentInput;
      currentInput = '0';
      updateDisplay();
    }

    function calculate() {
      let computation;
      const prev = parseFloat(previousInput);
      const current = parseFloat(currentInput);
      
      if (isNaN(prev) || isNaN(current)) return;

      switch (operation) {
        case '+':
          computation = prev + current;
          break;
        case '-':
          computation = prev - current;
          break;
        case '*':
          computation = prev * current;
          break;
        case '/':
          computation = current === 0 ? 'Error' : prev / current;
          break;
        default:
          return;
      }

      currentInput = computation.toString();
      operation = null;
      previousInput = '';
      updateDisplay();
    }

    function clearDisplay() {
      currentInput = '0';
      previousInput = '';
      operation = null;
      updateDisplay();
    }

    function deleteDigit() {
      if (currentInput.length === 1 || currentInput === 'Error') {
        currentInput = '0';
      } else {
        currentInput = currentInput.slice(0, -1);
      }
      updateDisplay();
    }
  </script>
</body>
</html>
